              func exportArtworkUIImage() -> UIImage? {
                  let desc = MTLTextureDescriptor.texture2DDescriptor(
                      pixelFormat: .bgra8Unorm,
                      width: simWidth,
                      height: simHeight,
                      mipmapped: false
                  )
                  desc.usage = [.renderTarget, .shaderRead]
                  desc.storageMode = .shared
                  guard let outTex = device.makeTexture(descriptor: desc),
                        let cb = commandQueue.makeCommandBuffer() else { return nil }

                  let pass = MTLRenderPassDescriptor()
                  pass.colorAttachments[0].texture = outTex
                  pass.colorAttachments[0].loadAction = .clear
                  pass.colorAttachments[0].storeAction = .store
                  pass.colorAttachments[0].clearColor = MTLClearColor(red: 1, green: 1, blue: 1, alpha: 1)

                  let tint = paperPreset.paperTint
                  var renderU = RenderUniforms(
                      pan: .zero,
                      zoom: 1.0,
                      rotation: 0.0,
                      viewportSize: SIMD2<Float>(Float(simWidth), Float(simHeight)),
                      canvasSize: SIMD2<Float>(Float(simWidth), Float(simHeight)),
                      paperTintAndBump: SIMD4<Float>(tint.x, tint.y, tint.z, paperPreset.bumpScale),
                      wetGlossiness: 0.0,
                      lightAzimuth: 0.78,
                      lightElevation: 1.05,
                      isExportPass: 1.0
                  )

                  if let rEnc = cb.makeRenderCommandEncoder(descriptor: pass) {
                      rEnc.setRenderPipelineState(renderPSO)
                      rEnc.setFragmentTexture(paperTex, index: 0)
                      rEnc.setFragmentTexture(waterTex[waterIdx], index: 1)
                      rEnc.setFragmentTexture(dep0Tex[pigIdx], index: 2)
                      rEnc.setFragmentTexture(dep1Tex[pigIdx], index: 3)
                      rEnc.setFragmentTexture(susp0Tex[pigIdx], index: 4)
                      rEnc.setFragmentTexture(susp1Tex[pigIdx], index: 5)
                      rEnc.setFragmentBytes(&renderU, length: MemoryLayout<RenderUniforms>.stride, index: 0)
                      rEnc.setFragmentBuffer(optBuffer, offset: 0, index: 1)
                      rEnc.drawPrimitives(type: .triangleStrip, vertexStart: 0, vertexCount: 4)
                      rEnc.endEncoding()
                  }

                  cb.commit()
                  cb.waitUntilCompleted()

                  let bytesPerRow = simWidth * 4
                  var rawData = [UInt8](repeating: 0, count: bytesPerRow * simHeight)
                  outTex.getBytes(&rawData, bytesPerRow: bytesPerRow, from: MTLRegionMake2D(0, 0, simWidth, simHeight), mipmapLevel: 0)

                  let colorSpace = CGColorSpaceCreateDeviceRGB()
                  let bitmapInfo = CGBitmapInfo.byteOrder32Little.rawValue | CGImageAlphaInfo.premultipliedFirst.rawValue
                  guard let provider = CGDataProvider(data: Data(rawData) as CFData),
                        let cgImage = CGImage(
                          width: simWidth,
                          height: simHeight,
                          bitsPerComponent: 8,
                          bitsPerPixel: 32,
                          bytesPerRow: bytesPerRow,
                          space: colorSpace,
                          bitmapInfo: CGBitmapInfo(rawValue: bitmapInfo),
                          provider: provider,
                          decode: nil,
                          shouldInterpolate: true,
                          intent: .defaultIntent
                        ) else { return nil }

                  return UIImage(cgImage: cgImage)
              }
