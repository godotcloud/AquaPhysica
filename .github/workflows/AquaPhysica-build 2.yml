              func viewPointToCanvasUV(_ point: CGPoint, in bounds: CGSize) -> SIMD2<Float>? {
                  guard bounds.width > 1 && bounds.height > 1 else { return nil }
                  let uv = SIMD2<Float>(Float(point.x / bounds.width), Float(point.y / bounds.height))
                  let viewCentered = (uv - SIMD2<Float>(0.5, 0.5)) * SIMD2<Float>(Float(bounds.width), Float(bounds.height))
                  let cosR = cos(-rotation)
                  let sinR = sin(-rotation)
                  let rotated = SIMD2<Float>(
                      viewCentered.x * cosR - viewCentered.y * sinR,
                      viewCentered.x * sinR + viewCentered.y * cosR
                  )
                  let canvasSize = SIMD2<Float>(Float(simWidth), Float(simHeight))
                  let fitScale = min(Float(bounds.width) / canvasSize.x, Float(bounds.height) / canvasSize.y) * 0.94
                  let canvasPx = rotated / max(fitScale * zoom, 1e-4) - pan * canvasSize
                  let cuv = canvasPx / canvasSize + SIMD2<Float>(0.5, 0.5)
                  if cuv.x < -0.05 || cuv.x > 1.05 || cuv.y < -0.05 || cuv.y > 1.05 {
                      return nil
                  }
                  return cuv
              }

