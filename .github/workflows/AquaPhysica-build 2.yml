        run: |
          cat << 'EOF_F9_P1' > Sources/Shaders/WatercolorShaders.metal
          #include <metal_stdlib>
          using namespace metal;

          // ============================================================================
          // AquaPhysica - Physically-Based Watercolor Simulation Metal 3 Shaders
          // Pillars:
          //   1. Fluid Dynamics: 2D Shallow-Water Navier-Stokes + Capillary Porous Media
          //      + Edge-Enhanced Evaporation (Coffee-Ring Effect) + Tilt Gravity
          //   2. Molecular & Colloidal Dynamics: 8-Pigment Stokes-Einstein Brownian
          //      Diffusion, Stokes Valley Settling (Granulation), DLVO Flocculation,
          //      and Cellulose Adsorption / Re-wetting Lifting
          //   3. Optical Model: 8-Pigment Kubelka-Munk Two-Flux Radiative Transfer
          //      + Paper Micro-Relief Lighting + Wet Water Schlick Fresnel Specular Sheen
          // ============================================================================

          struct PaperParams {
              float seed;
              float grainScale;
              float roughness;
              float fiberAnisotropy;
              float capMin;
              float capMax;
              float pad0;
              float pad1;
          };

          struct BrushStampUniforms {
              float2 startPos;        // Normalized [0, 1]
              float2 endPos;          // Normalized [0, 1]
              float2 velocity;        // Brush stroke velocity in texels/frame
              float radius;           // Normalized radius
              float waterLoad;        // Water deposited [0, 1]
              float pigmentLoad;      // Pigment concentration [0, 1]
              float pressure;         // Touch/Pencil pressure [0, 1]
              float bristleStrength;  // Bristle texture modulation [0, 1]
              uint toolMode;          // 0=Paint, 1=CleanWater, 2=LiftSponge, 3=DryBrush
              float4 pigmentMix0;     // Weights for pigments 0..3
              float4 pigmentMix1;     // Weights for pigments 4..7
          };

          struct SimUniforms {
              float dt;
              float viscosity;
              float dragCoeff;
              float paperSlopeStrength;
              float2 gravity;         // CoreMotion tilt gravity in canvas space
              float capillaryRate;    // Surface -> paper pore absorption rate
              float poreDiffusion;    // Lateral capillary diffusion rate
              float evapBaseRate;     // Base evaporation rate
              float evapEdgeBoost;    // Coffee-ring edge evaporation boost
              float edgePullStrength; // Outward capillary flow toward drying boundary
              float temperature;      // Thermal scaling for Brownian diffusion
              float dryBoost;         // Hairdryer multiplier (1.0 normal, >10.0 blow-dry)
              float pad0;
          };

          struct PigmentPhysicsData {
              // Per-pigment physical properties (8 pigments)
              // x: Brownian diffusivity (inverse particle radius)
              // y: Stokes settling / granulation rate (particle density * r^2)
              // z: DLVO flocculation strength (clumping tendency)
              // w: Cellulose staining / adsorption affinity (high = permanent, low = liftable)
              float4 phys[8];
          };

          struct PigmentOpticalData {
              // Kubelka-Munk Absorption (K) and Scattering (S) coefficients per pigment
              // Stored as float4 (rgb = K or S in linear wide-gamut space, w = optical density scale)
              float4 K[8];
              float4 S[8];
          };

          struct RenderUniforms {
              float2 pan;               // Normalized pan offset
              float zoom;               // Zoom scale
              float rotation;           // Canvas rotation in radians
              float2 viewportSize;      // Metal view drawable size
              float2 canvasSize;        // Simulation texture size
              float4 paperTintAndBump;  // xyz = cotton paper R0 tint, w = paperBumpScale
              float wetGlossiness;      // Wet water specular sheen intensity
              float lightAzimuth;       // Studio lamp azimuth angle
              float lightElevation;     // Studio lamp elevation angle
              float isExportPass;       // 1.0 = full canvas export (no pan/zoom/desk), 0.0 = interactive
          };

          // ============================================================================
          // Procedural Noise Helpers (Deterministic, Metal-Safe, No cbrt)
          // ============================================================================

          inline float hash21(float2 p) {
              p = fract(p * float2(123.34f, 456.21f));
              p += dot(p, p + 45.32f);
              return fract(p.x * p.y);
          }

          inline float valueNoise(float2 p) {
              float2 i = floor(p);
              float2 f = fract(p);
              float2 u = f * f * (3.0f - 2.0f * f);
              float a = hash21(i + float2(0.0f, 0.0f));
              float b = hash21(i + float2(1.0f, 0.0f));
              float c = hash21(i + float2(0.0f, 1.0f));
              float d = hash21(i + float2(1.0f, 1.0f));
              return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }

          inline float fbm(float2 p, int octaves) {
              float v = 0.0f;
              float amp = 0.5f;
              float2x2 rot = float2x2(0.8f, -0.6f, 0.6f, 0.8f);
              for (int i = 0; i < octaves; ++i) {
                  v += amp * valueNoise(p);
                  p = rot * p * 2.03f + float2(17.1f, 31.7f);
                  amp *= 0.5f;
              }
              return v;
          }

          inline int2 clampCoord(int2 c, int2 dims) {
              return clamp(c, int2(0), dims - int2(1));
          }

          // ============================================================================
          // Kernel 1: Procedural Cotton Watercolor Paper Micro-Relief Generator
          // ============================================================================

          kernel void generatePaperKernel(
              texture2d<float, access::write> paperTex [[texture(0)]],
              constant PaperParams& params [[buffer(0)]],
              uint2 gid [[thread_position_in_grid]])
          {
              uint width = paperTex.get_width();
              uint height = paperTex.get_height();
              if (gid.x >= width || gid.y >= height) return;

              float2 uv = float2(gid) / float2(width, height);
              float2 p = uv * params.grainScale + float2(params.seed * 13.7f, params.seed * 29.3f);

              float macroGrain = fbm(p * 1.0f, 4);
              float midGrain = fbm(p * 2.7f + float2(4.2f, 9.1f), 4);
              float microTooth = fbm(p * 8.5f + float2(11.3f, 2.8f), 3);

              float fiberX = valueNoise(float2(p.x * 1.8f, p.y * 14.0f));
              float fiberY = valueNoise(float2(p.x * 14.0f, p.y * 1.8f));
              float fibers = mix(0.5f, 0.5f * (fiberX + fiberY), params.fiberAnisotropy);

              float h = macroGrain * 0.45f + midGrain * 0.30f + microTooth * 0.15f + fibers * 0.10f;
              h = clamp((h - 0.5f) * (0.65f + params.roughness * 1.15f) + 0.5f, 0.0f, 1.0f);

              float capacity = mix(params.capMin, params.capMax, 1.0f - h * 0.65f);
              float microPocket = clamp(1.0f - h, 0.0f, 1.0f);
              float sizing = clamp(0.75f + 0.25f * fbm(p * 0.65f + float2(5.0f, 7.0f), 3), 0.5f, 1.0f);

              paperTex.write(float4(h, capacity, microPocket, sizing), gid);
          }

          // ============================================================================
          // Kernel 2: Brush Stroke Stamp (Paint, CleanWater, LiftSponge, DryBrush)
          // ============================================================================

          kernel void brushStampKernel(
              texture2d<float, access::read> paperTex [[texture(0)]],
              texture2d<float, access::read> waterIn [[texture(1)]],
              texture2d<float, access::write> waterOut [[texture(2)]],
              texture2d<float, access::read> velIn [[texture(3)]],
              texture2d<float, access::write> velOut [[texture(4)]],
              texture2d<float, access::read> susp0In [[texture(5)]],
              texture2d<float, access::write> susp0Out [[texture(6)]],
              texture2d<float, access::read> susp1In [[texture(7)]],
              texture2d<float, access::write> susp1Out [[texture(8)]],
              texture2d<float, access::read> dep0In [[texture(9)]],
              texture2d<float, access::write> dep0Out [[texture(10)]],
              texture2d<float, access::read> dep1In [[texture(11)]],
              texture2d<float, access::write> dep1Out [[texture(12)]],
              constant BrushStampUniforms& u [[buffer(0)]],
              constant PigmentPhysicsData& physData [[buffer(1)]],
              uint2 gid [[thread_position_in_grid]])
          {
              uint width = waterIn.get_width();
              uint height = waterIn.get_height();
              if (gid.x >= width || gid.y >= height) return;

              float2 dims = float2(width, height);
              float2 uv = (float2(gid) + 0.5f) / dims;
              float aspect = dims.x / dims.y;

              float4 paper = paperTex.read(gid);
              float4 water = waterIn.read(gid);
              float4 vel = velIn.read(gid);
              float4 s0 = susp0In.read(gid);
              float4 s1 = susp1In.read(gid);
              float4 d0 = dep0In.read(gid);
              float4 d1 = dep1In.read(gid);

              float2 pA = float2(u.startPos.x * aspect, u.startPos.y);
              float2 pB = float2(u.endPos.x * aspect, u.endPos.y);
              float2 pP = float2(uv.x * aspect, uv.y);
              float2 ab = pB - pA;
              float abLenSq = dot(ab, ab);
              float t = (abLenSq > 1e-7f) ? clamp(dot(pP - pA, ab) / abLenSq, 0.0f, 1.0f) : 0.0f;
              float2 closest = pA + ab * t;
              float dist = length(pP - closest);

              float effRadius = max(u.radius * (0.45f + 0.75f * u.pressure), 0.002f);
              if (dist < effRadius) {
                  float normDist = dist / effRadius;
                  float falloff = 1.0f - normDist * normDist;
                  falloff = falloff * falloff;

                  float2 dir = (abLenSq > 1e-7f) ? normalize(ab) : float2(1.0f, 0.0f);
                  float2 perp = float2(-dir.y, dir.x);
                  float bristleCoord = dot(pP - pA, perp) / effRadius;
                  float bristleNoise = valueNoise(float2(bristleCoord * 14.0f, t * 4.0f + u.startPos.x * 20.0f));
                  float bristleMod = mix(1.0f, 0.55f + 0.75f * bristleNoise, u.bristleStrength);

                  float strength = falloff * bristleMod;

                  if (u.toolMode == 0) {
                      float addWater = u.waterLoad * strength * 0.55f;
                      water.x = min(water.x + addWater, 2.5f);
                      water.z = max(water.z, smoothstep(0.02f, 0.12f, water.x + water.y));

                      float pigAmt = u.pigmentLoad * strength * 0.38f;
                      s0 = min(s0 + u.pigmentMix0 * pigAmt, float4(4.0f));
                      s1 = min(s1 + u.pigmentMix1 * pigAmt, float4(4.0f));

                      vel.xy += clamp(u.velocity * 0.18f, float2(-1.5f), float2(1.5f)) * strength;
                  } else if (u.toolMode == 1) {
                      float addWater = u.waterLoad * strength * 0.65f;
                      water.x = min(water.x + addWater, 2.5f);
                      water.z = max(water.z, smoothstep(0.02f, 0.10f, water.x + water.y));
                      vel.xy += clamp(u.velocity * 0.22f, float2(-1.5f), float2(1.5f)) * strength;
                  } else if (u.toolMode == 2) {
                      float lift = strength * (0.28f + 0.45f * u.pressure);
                      water.x = max(0.0f, water.x * (1.0f - lift * 0.75f));
                      water.y = max(0.0f, water.y * (1.0f - lift * 0.35f));
                      s0 *= (1.0f - lift * 0.85f);
                      s1 *= (1.0f - lift * 0.85f);

                      float4 liftability0 = float4(
                          1.0f - physData.phys[0].w,
                          1.0f - physData.phys[1].w,
                          1.0f - physData.phys[2].w,
                          1.0f - physData.phys[3].w
                      );
                      float4 liftability1 = float4(
                          1.0f - physData.phys[4].w,
                          1.0f - physData.phys[5].w,
                          1.0f - physData.phys[6].w,
                          1.0f - physData.phys[7].w
                      );
                      d0 = max(float4(0.0f), d0 * (1.0f - lift * 0.45f * liftability0));
                      d1 = max(float4(0.0f), d1 * (1.0f - lift * 0.45f * liftability1));
                  } else if (u.toolMode == 3) {
                      float peakCatch = smoothstep(0.42f, 0.72f, paper.x);
                      float dryAmt = u.pigmentLoad * strength * peakCatch * 0.45f;
                      d0 = min(d0 + u.pigmentMix0 * dryAmt, float4(4.0f));
                      d1 = min(d1 + u.pigmentMix1 * dryAmt, float4(4.0f));
                      water.x = min(water.x + u.waterLoad * strength * peakCatch * 0.08f, 2.5f);
                  }
              }

              waterOut.write(water, gid);
              velOut.write(vel, gid);
              susp0Out.write(s0, gid);
              susp1Out.write(s1, gid);
              dep0Out.write(d0, gid);
              dep1Out.write(d1, gid);
          }

