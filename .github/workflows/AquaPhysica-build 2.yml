              float4 wR = waterTex.read(cR);
              float4 wD = waterTex.read(cD);
              float4 wU = waterTex.read(cU);
              float2 gradWater = float2(wR.x - wL.x, wU.x - wD.x) * 0.5f;

              float2 gradMask = float2(wR.z - wL.z, wU.z - wD.z) * 0.5f;
