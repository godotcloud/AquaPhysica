              float2 vR = velIn.read(cR).xy;
              float2 vD = velIn.read(cD).xy;
              float2 vU = velIn.read(cU).xy;
              float2 lapVel = (vL + vR + vD + vU - 4.0f * velC);

              float hL = paperTex.read(cL).x;
              float hR = paperTex.read(cR).x;
              float hD = paperTex.read(cD).x;
