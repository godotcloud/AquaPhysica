name: Build AquaPhysica iOS (macOS 15)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Project Directories
        run: |
          mkdir -p Resources Sources/App Sources/Models Sources/Engine Sources/Views Sources/Shaders

      - name: Write project.yml
        run: |
          cat << 'EOF_F1_P1' > project.yml
          name: AquaPhysica
          options:
            bundleIdPrefix: com.aquaphysica
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "16.0"
            generateEmptyDirectories: true

          settings:
            base:
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              ENABLE_BITCODE: NO
              MTL_FAST_MATH: YES
              DEVELOPMENT_TEAM: ""
              CODE_SIGN_STYLE: Automatic

          targets:
            AquaPhysica:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: AquaPhysica
                  CFBundleName: AquaPhysica
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: true
                  UIStatusBarHidden: true
                  UIViewControllerBasedStatusBarAppearance: false
                  CADisableMinimumFrameDurationOnPhone: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSPhotoLibraryAddUsageDescription: "AquaPhysica 需要相册权限以保存您的高清物理水彩画作。"
                  NSMotionUsageDescription: "AquaPhysica 使用设备重力感应模拟水彩画纸倾斜时的真实水流。"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.aquaphysica.watercolor
                  INFOPLIST_FILE: Resources/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  LD_RUNPATH_SEARCH_PATHS:
                    - "$(inherited)"
                    - "@executable_path/Frameworks"
          EOF_F1_P1

      - name: Write Resources/Info.plist
        run: |
          cat << 'EOF_F2_P1' > Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>AquaPhysica</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>AquaPhysica</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CADisableMinimumFrameDurationOnPhone</key>
              <true/>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>AquaPhysica 需要相册权限以保存您的高清物理水彩画作。</string>
              <key>NSMotionUsageDescription</key>
              <string>AquaPhysica 使用设备重力感应模拟水彩画纸倾斜时的真实水流。</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF_F2_P1

      - name: Write Sources/App/AquaPhysicaApp.swift
        run: |
          cat << 'EOF_F3_P1' > Sources/App/AquaPhysicaApp.swift
          import SwiftUI

          @main
          struct AquaPhysicaApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF_F3_P1

      - name: Write Sources/Models/PigmentModels.swift
        run: |
          cat << 'EOF_F4_P1' > Sources/Models/PigmentModels.swift
          import SwiftUI
          import simd

          // ============================================================================
          // Physical Watercolor Pigment Catalog & Shared GPU Uniform Structures
          // ============================================================================

          enum BrushToolMode: UInt32, CaseIterable, Identifiable {
              case paint = 0
              case cleanWater = 1
              case liftSponge = 2
              case dryBrush = 3

              var id: UInt32 { rawValue }

              var title: String {
                  switch self {
                  case .paint: return "水彩笔"
                  case .cleanWater: return "清水笔"
                  case .liftSponge: return "提白海绵"
                  case .dryBrush: return "干擦飞白"
                  }
              }

              var iconName: String {
                  switch self {
                  case .paint: return "paintbrush.pointed.fill"
                  case .cleanWater: return "drop.fill"
                  case .liftSponge: return "eraser.fill"
                  case .dryBrush: return "scribble.variable"
                  }
              }
          }

          enum PaperPreset: String, CaseIterable, Identifiable {
              case coldPress = "冷压棉浆 300g"
              case rough = "粗纹阿诗 300g"
              case hotPress = "热压细纹 300g"

              var id: String { rawValue }

              var params: PaperParams {
                  switch self {
                  case .coldPress:
                      return PaperParams(seed: 1.37, grainScale: 34.0, roughness: 0.72, fiberAnisotropy: 0.55, capMin: 0.25, capMax: 0.85, pad0: 0, pad1: 0)
                  case .rough:
                      return PaperParams(seed: 4.91, grainScale: 22.0, roughness: 1.05, fiberAnisotropy: 0.75, capMin: 0.30, capMax: 1.05, pad0: 0, pad1: 0)
                  case .hotPress:
                      return PaperParams(seed: 8.13, grainScale: 58.0, roughness: 0.28, fiberAnisotropy: 0.30, capMin: 0.16, capMax: 0.55, pad0: 0, pad1: 0)
                  }
              }

              var bumpScale: Float {
                  switch self {
                  case .coldPress: return 2.4
                  case .rough: return 3.6
                  case .hotPress: return 1.1
                  }
              }

              var paperTint: SIMD3<Float> {
                  switch self {
                  case .coldPress: return SIMD3<Float>(0.975, 0.962, 0.935)
                  case .rough:     return SIMD3<Float>(0.965, 0.948, 0.915)
                  case .hotPress:  return SIMD3<Float>(0.988, 0.980, 0.962)
                  }
              }
          }

          struct PigmentSpec: Identifiable {
              let id: Int
              let code: String
              let nameZH: String
              let nameEN: String
              let uiColor: Color
              let subtitle: String
              // Molecular/Colloidal physics: x=diffusivity, y=granulation, z=flocculation, w=staining
              let physics: SIMD4<Float>
              // Kubelka-Munk optical coefficients (xyz = K or S, w = density scale)
              let K: SIMD4<Float>
              let S: SIMD4<Float>

              static let catalog: [PigmentSpec] = [
                  PigmentSpec(
                      id: 0, code: "PB29", nameZH: "法国群青", nameEN: "French Ultramarine",
                      uiColor: Color(red: 0.13, green: 0.24, blue: 0.72),
                      subtitle: "强沉淀 · 易提白 · 矿物颗粒",
                      physics: SIMD4<Float>(0.42, 0.92, 0.85, 0.22),
                      K: SIMD4<Float>(1.45, 0.88, 0.08, 1.35),
                      S: SIMD4<Float>(0.04, 0.06, 0.22, 1.0)
                  ),
                  PigmentSpec(
                      id: 1, code: "PB35", nameZH: "天青蓝", nameEN: "Cerulean Blue",
                      uiColor: Color(red: 0.10, green: 0.52, blue: 0.78),
                      subtitle: "极重沉淀 · 半不透明 · 钴锡矿",
                      physics: SIMD4<Float>(0.30, 1.00, 0.72, 0.18),
                      K: SIMD4<Float>(1.55, 0.34, 0.10, 1.25),
                      S: SIMD4<Float>(0.10, 0.26, 0.42, 1.0)
                  ),
                  PigmentSpec(
                      id: 2, code: "PY3", nameZH: "汉莎浅黄", nameEN: "Hansa Yellow Light",
                      uiColor: Color(red: 0.96, green: 0.84, blue: 0.12),
                      subtitle: "高扩散 · 透明 · 细有机分子",
                      physics: SIMD4<Float>(0.92, 0.12, 0.10, 0.35),
                      K: SIMD4<Float>(0.04, 0.12, 1.95, 1.25),
                      S: SIMD4<Float>(0.18, 0.16, 0.03, 1.0)
                  ),
                  PigmentSpec(
                      id: 3, code: "PV19", nameZH: "喹吖啶酮玫红", nameEN: "Quinacridone Rose",
                      uiColor: Color(red: 0.84, green: 0.14, blue: 0.42),
                      subtitle: "高染色 · 高透亮 · 强纤维吸附",
                      physics: SIMD4<Float>(0.88, 0.10, 0.12, 0.88),
                      K: SIMD4<Float>(0.10, 1.75, 0.62, 1.35),
                      S: SIMD4<Float>(0.06, 0.02, 0.04, 1.0)
                  ),
                  PigmentSpec(
                      id: 4, code: "PBr7", nameZH: "熟赭", nameEN: "Burnt Sienna",
                      uiColor: Color(red: 0.68, green: 0.28, blue: 0.14),
                      subtitle: "絮凝沉淀 · 氧化铁矿 · 混群青成高级灰",
                      physics: SIMD4<Float>(0.48, 0.82, 0.78, 0.45),
                      K: SIMD4<Float>(0.24, 1.12, 1.85, 1.40),
                      S: SIMD4<Float>(0.12, 0.05, 0.03, 1.0)
                  ),
                  PigmentSpec(
                      id: 5, code: "PG7", nameZH: "酞菁绿", nameEN: "Phthalo Green",
                      uiColor: Color(red: 0.02, green: 0.48, blue: 0.34),
                      subtitle: "超强染色 · 极细微粒 · 极速扩散",
                      physics: SIMD4<Float>(0.98, 0.06, 0.08, 0.94),
                      K: SIMD4<Float>(2.10, 0.28, 0.78, 1.45),
                      S: SIMD4<Float>(0.02, 0.07, 0.04, 1.0)
                  ),
                  PigmentSpec(
                      id: 6, code: "PY43", nameZH: "土黄", nameEN: "Yellow Ochre",
                      uiColor: Color(red: 0.80, green: 0.56, blue: 0.18),
                      subtitle: "天然铁矿 · 半不透明 · 纸谷沉积",
                      physics: SIMD4<Float>(0.38, 0.74, 0.58, 0.30),
                      K: SIMD4<Float>(0.18, 0.48, 1.65, 1.30),
                      S: SIMD4<Float>(0.34, 0.22, 0.08, 1.0)
                  ),
                  PigmentSpec(
                      id: 7, code: "PBk11", nameZH: "月光黑", nameEN: "Lunar Black",
                      uiColor: Color(red: 0.16, green: 0.16, blue: 0.18),
                      subtitle: "磁铁矿 · 极端絮凝沉淀 · 戏剧化颗粒",
                      physics: SIMD4<Float>(0.22, 1.00, 1.00, 0.32),
                      K: SIMD4<Float>(1.85, 1.85, 1.90, 1.55),
                      S: SIMD4<Float>(0.05, 0.05, 0.05, 1.0)
                  )
              ]

              static func makePhysicsData() -> PigmentPhysicsData {
                  var data = PigmentPhysicsData()
                  data.phys = (
                      catalog[0].physics, catalog[1].physics, catalog[2].physics, catalog[3].physics,
                      catalog[4].physics, catalog[5].physics, catalog[6].physics, catalog[7].physics
                  )
                  return data
              }

              static func makeOpticalData() -> PigmentOpticalData {
                  var data = PigmentOpticalData()
                  data.K = (
                      catalog[0].K, catalog[1].K, catalog[2].K, catalog[3].K,
                      catalog[4].K, catalog[5].K, catalog[6].K, catalog[7].K
                  )
                  data.S = (
                      catalog[0].S, catalog[1].S, catalog[2].S, catalog[3].S,
                      catalog[4].S, catalog[5].S, catalog[6].S, catalog[7].S
                  )
                  return data
              }
          }

          // ============================================================================
          // Exact Metal-Aligned Uniform Structs (Zero float3 Padding Traps)
          // ============================================================================

          struct PaperParams {
              var seed: Float
              var grainScale: Float
              var roughness: Float
              var fiberAnisotropy: Float
              var capMin: Float
              var capMax: Float
              var pad0: Float
              var pad1: Float
          }

          struct BrushStampUniforms {
              var startPos: SIMD2<Float>
              var endPos: SIMD2<Float>
              var velocity: SIMD2<Float>
              var radius: Float
              var waterLoad: Float
              var pigmentLoad: Float
              var pressure: Float
              var bristleStrength: Float
              var toolMode: UInt32
              var pigmentMix0: SIMD4<Float>
              var pigmentMix1: SIMD4<Float>
          }

          struct SimUniforms {
              var dt: Float
              var viscosity: Float
              var dragCoeff: Float
              var paperSlopeStrength: Float
              var gravity: SIMD2<Float>
              var capillaryRate: Float
              var poreDiffusion: Float
              var evapBaseRate: Float
              var evapEdgeBoost: Float
              var edgePullStrength: Float
              var temperature: Float
              var dryBoost: Float
              var pad0: Float
          }

          struct PigmentPhysicsData {
              var phys: (
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>,
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>
              ) = (.zero, .zero, .zero, .zero, .zero, .zero, .zero, .zero)
          }

          struct PigmentOpticalData {
              var K: (
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>,
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>
              ) = (.zero, .zero, .zero, .zero, .zero, .zero, .zero, .zero)
              var S: (
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>,
                  SIMD4<Float>, SIMD4<Float>, SIMD4<Float>, SIMD4<Float>
              ) = (.zero, .zero, .zero, .zero, .zero, .zero, .zero, .zero)
          }

          struct RenderUniforms {
              var pan: SIMD2<Float>
              var zoom: Float
              var rotation: Float
              var viewportSize: SIMD2<Float>
              var canvasSize: SIMD2<Float>
              var paperTintAndBump: SIMD4<Float>
              var wetGlossiness: Float
              var lightAzimuth: Float
              var lightElevation: Float
              var isExportPass: Float
          }
          EOF_F4_P1

      - name: Write Sources/Engine/GravityMotionManager.swift
        run: |
          cat << 'EOF_F5_P1' > Sources/Engine/GravityMotionManager.swift
          import Foundation
          import CoreMotion
          import simd

          final class GravityMotionManager: ObservableObject {
              private let motionManager = CMMotionManager()
              @Published var isGravityEnabled: Bool = true
              @Published var gravityVector: SIMD2<Float> = .zero

              func start() {
                  guard motionManager.isDeviceMotionAvailable else { return }
                  motionManager.deviceMotionUpdateInterval = 1.0 / 60.0
                  motionManager.startDeviceMotionUpdates(to: .main) { [weak self] motion, _ in
                      guard let self = self, let g = motion?.gravity else { return }
                      if self.isGravityEnabled {
                          // Map iOS device gravity (x right, y up) into canvas UV space (x right, y down)
                          let raw = SIMD2<Float>(Float(g.x), Float(-g.y))
                          // Low-pass filter for smooth natural fluid acceleration
                          self.gravityVector = self.gravityVector * 0.82 + raw * 0.18
                      } else {
                          self.gravityVector = .zero
                      }
                  }
              }

              func stop() {
                  motionManager.stopDeviceMotionUpdates()
              }
          }
          EOF_F5_P1

      - name: Write Sources/Engine/WatercolorEngine.swift (Part 1/3)
        run: |
          cat << 'EOF_F6_P1' > Sources/Engine/WatercolorEngine.swift
          import Foundation
          import Metal
          import MetalKit
          import UIKit
          import QuartzCore
          import simd

          struct StrokeSegment {
              let startUV: SIMD2<Float>
              let endUV: SIMD2<Float>
              let velocity: SIMD2<Float>
              let pressure: Float
          }

          private struct CanvasSnapshot {
              let water: MTLTexture
              let dep0: MTLTexture
              let dep1: MTLTexture
              let susp0: MTLTexture
              let susp1: MTLTexture
          }

          final class WatercolorEngine: NSObject, ObservableObject, MTKViewDelegate {
              // MARK: - Published Painting State
              @Published var toolMode: BrushToolMode = .paint
              @Published var paperPreset: PaperPreset = .coldPress
              @Published var brushSize: Float = 0.042
              @Published var waterLoad: Float = 0.72
              @Published var pigmentLoad: Float = 0.65
              @Published var bristleStrength: Float = 0.35
              @Published var gravityStrength: Float = 1.65
              @Published var isBlowDrying: Bool = false
              @Published var isSimulationPaused: Bool = false
              @Published var wetGlossiness: Float = 0.85

              // 8-Pigment Mixing Weights (supports pure pigment or real physical mixing!)
              @Published var pigmentWeights: [Float] = [1, 0, 0, 0, 0, 0, 0, 0]
              @Published var activePigmentIndex: Int = 0
              @Published var canUndo: Bool = false
              @Published var canRedo: Bool = false

              // Viewport Transform (Pan, Zoom, Rotate)
              var pan: SIMD2<Float> = .zero
              var zoom: Float = 1.0
              var rotation: Float = 0.0
              var viewportSize: SIMD2<Float> = SIMD2<Float>(428, 926)

              // External Gravity Provider
              weak var motionManager: GravityMotionManager?

              // MARK: - Metal Core
              let device: MTLDevice
              private let commandQueue: MTLCommandQueue

              // Compute Pipelines
              private var generatePaperPSO: MTLComputePipelineState!
              private var brushStampPSO: MTLComputePipelineState!
              private var velAdvectPSO: MTLComputePipelineState!
              private var divergencePSO: MTLComputePipelineState!
              private var pressureJacobiPSO: MTLComputePipelineState!
              private var velProjectPSO: MTLComputePipelineState!
              private var capillaryEvapPSO: MTLComputePipelineState!
              private var pigmentMolPSO: MTLComputePipelineState!
              private var preWetPSO: MTLComputePipelineState!
              private var instantDryPSO: MTLComputePipelineState!
              private var clearCanvasPSO: MTLComputePipelineState!

              // Render Pipeline
              private var renderPSO: MTLRenderPipelineState!

              // Simulation Grid (3:4 Classic Watercolor Sheet, optimized for 120Hz A15 Bionic)
              let simWidth: Int = 1024
              let simHeight: Int = 1365

              // Simulation Textures (Ping-Pong Pairs)
              private var paperTex: MTLTexture!
              private var waterTex: [MTLTexture] = []
              private var velTex: [MTLTexture] = []
              private var divTex: MTLTexture!
              private var pressTex: [MTLTexture] = []
              private var susp0Tex: [MTLTexture] = []
              private var susp1Tex: [MTLTexture] = []
              private var dep0Tex: [MTLTexture] = []
              private var dep1Tex: [MTLTexture] = []

              private var waterIdx = 0
              private var velIdx = 0
              private var pressIdx = 0
              private var pigIdx = 0

              // GPU Constant Buffers
              private var physBuffer: MTLBuffer!
              private var optBuffer: MTLBuffer!

              // Queued Actions & Strokes
              private let strokeLock = NSLock()
              private var pendingStrokes: [StrokeSegment] = []
              private var needsPaperRegen = true
              private var needsPreWet = false
              private var needsInstantDry = false
              private var needsClear = false

              // Undo/Redo GPU Texture Stack
              private var undoStack: [CanvasSnapshot] = []
              private var redoStack: [CanvasSnapshot] = []
              private let maxUndoCount = 10

              private var lastFrameTime: CFTimeInterval = CACurrentMediaTime()

              override init() {
                  guard let dev = MTLCreateSystemDefaultDevice(),
                        let queue = dev.makeCommandQueue() else {
                      fatalError("Metal 3 device unavailable on this iOS device.")
                  }
                  self.device = dev
                  self.commandQueue = queue
                  super.init()

                  setupPipelines()
                  setupTextures()
                  setupBuffers()
              }

              // MARK: - Setup
              private func setupPipelines() {
                  guard let library = device.makeDefaultLibrary() else {
                      fatalError("Failed to load default Metal shader library.")
                  }

                  func makeCompute(_ name: String) -> MTLComputePipelineState {
                      guard let fn = library.makeFunction(name: name) else {
                          fatalError("Missing Metal kernel function: \(name)")
                      }
                      return try! device.makeComputePipelineState(function: fn)
                  }

                  generatePaperPSO = makeCompute("generatePaperKernel")
                  brushStampPSO = makeCompute("brushStampKernel")
                  velAdvectPSO = makeCompute("velocityAdvectForceKernel")
                  divergencePSO = makeCompute("divergenceKernel")
                  pressureJacobiPSO = makeCompute("pressureJacobiKernel")
                  velProjectPSO = makeCompute("velocityProjectKernel")
                  capillaryEvapPSO = makeCompute("capillaryEvapKernel")
                  pigmentMolPSO = makeCompute("pigmentMolecularKernel")
                  preWetPSO = makeCompute("preWetCanvasKernel")
                  instantDryPSO = makeCompute("instantDryKernel")
                  clearCanvasPSO = makeCompute("clearCanvasKernel")

                  let renderDesc = MTLRenderPipelineDescriptor()
                  renderDesc.vertexFunction = library.makeFunction(name: "watercolorVertex")
                  renderDesc.fragmentFunction = library.makeFunction(name: "watercolorFragment")
                  renderDesc.colorAttachments[0].pixelFormat = .bgra8Unorm
                  renderPSO = try! device.makeRenderPipelineState(descriptor: renderDesc)
              }

              private func makeSimTexture(pixelFormat: MTLPixelFormat = .rgba16Float) -> MTLTexture {
                  let desc = MTLTextureDescriptor.texture2DDescriptor(
                      pixelFormat: pixelFormat,
                      width: simWidth,
                      height: simHeight,
                      mipmapped: false
                  )
                  desc.usage = [.shaderRead, .shaderWrite]
                  desc.storageMode = .private
                  guard let tex = device.makeTexture(descriptor: desc) else {
                      fatalError("Failed to allocate Metal simulation texture.")
                  }
                  return tex
              }

              private func setupTextures() {
                  paperTex = makeSimTexture()
                  waterTex = [makeSimTexture(), makeSimTexture()]
                  velTex = [makeSimTexture(), makeSimTexture()]
                  divTex = makeSimTexture(pixelFormat: .r16Float)
                  pressTex = [makeSimTexture(pixelFormat: .r16Float), makeSimTexture(pixelFormat: .r16Float)]
                  susp0Tex = [makeSimTexture(), makeSimTexture()]
                  susp1Tex = [makeSimTexture(), makeSimTexture()]
                  dep0Tex = [makeSimTexture(), makeSimTexture()]
                  dep1Tex = [makeSimTexture(), makeSimTexture()]

                  // Zero-initialize all simulation fields
                  if let cb = commandQueue.makeCommandBuffer() {
                      encodeClear(cb)
                      cb.commit()
                      cb.waitUntilCompleted()
                  }
              }

              private func setupBuffers() {
                  var phys = PigmentSpec.makePhysicsData()
                  physBuffer = device.makeBuffer(bytes: &phys, length: MemoryLayout<PigmentPhysicsData>.stride, options: .storageModeShared)

                  var opt = PigmentSpec.makeOpticalData()
                  optBuffer = device.makeBuffer(bytes: &opt, length: MemoryLayout<PigmentOpticalData>.stride, options: .storageModeShared)
              }

              // MARK: - Public Controls
              func selectPurePigment(_ index: Int) {
                  guard index >= 0 && index < 8 else { return }
                  activePigmentIndex = index
                  var weights = Array(repeating: Float(0.0), count: 8)
                  weights[index] = 1.0
                  pigmentWeights = weights
              }

              func mixPigment(_ index: Int, amount: Float = 0.5) {
                  guard index >= 0 && index < 8 else { return }
                  activePigmentIndex = index
                  var weights = pigmentWeights
                  weights[index] = min(weights[index] + amount, 1.5)
                  let sum = weights.reduce(0, +)
                  if sum > 0.0001 {
                      weights = weights.map { $0 / sum }
                  }
                  pigmentWeights = weights
              }

              func setPaperPreset(_ preset: PaperPreset) {
                  paperPreset = preset
                  needsPaperRegen = true
              }

              func triggerPreWet() {
                  pushUndoSnapshot()
                  needsPreWet = true
              }

              func triggerInstantDry() {
                  pushUndoSnapshot()
                  needsInstantDry = true
              }

              func triggerClearCanvas() {
                  pushUndoSnapshot()
                  needsClear = true
              }

              func resetCamera() {
                  pan = .zero
                  zoom = 1.0
                  rotation = 0.0
              }

