          // ============================================================================
          // Kernel 7: Capillary Porous Media Transport, Wet-Mask Expansion & Evaporation
          // ============================================================================

          kernel void capillaryEvapKernel(
              texture2d<float, access::read> paperTex [[texture(0)]],
              texture2d<float, access::read> waterIn [[texture(1)]],
              texture2d<float, access::read> velTex [[texture(2)]],
              texture2d<float, access::write> waterOut [[texture(3)]],
              constant SimUniforms& u [[buffer(0)]],
              uint2 gid [[thread_position_in_grid]])
          {
              int2 dims = int2(waterIn.get_width(), waterIn.get_height());
              int2 c = int2(gid);
              if (c.x >= dims.x || c.y >= dims.y) return;

              float4 paper = paperTex.read(gid);
              float cap = paper.y;
              float sizing = paper.w;

              float4 wC = waterIn.read(gid);
              float hs = wC.x;
              float hc = wC.y;
              float mask = wC.z;

              float2 vel = velTex.read(gid).xy;
              float2 backPos = clamp(float2(c) - vel * u.dt * 0.65f, float2(0.0f), float2(dims - int2(1)));
              int2 p0 = int2(floor(backPos));
              int2 p1 = clampCoord(p0 + int2(1), dims);
              float2 f = fract(backPos);
              float hsAdv = mix(
                  mix(waterIn.read(uint2(p0.x, p0.y)).x, waterIn.read(uint2(p1.x, p0.y)).x, f.x),
                  mix(waterIn.read(uint2(p0.x, p1.y)).x, waterIn.read(uint2(p1.x, p1.y)).x, f.x),
                  f.y
              );
              hs = mix(hs, hsAdv, 0.65f);

              uint2 cL = uint2(clampCoord(c + int2(-1, 0), dims));
              uint2 cR = uint2(clampCoord(c + int2( 1, 0), dims));
              uint2 cD = uint2(clampCoord(c + int2( 0,-1), dims));
              uint2 cU = uint2(clampCoord(c + int2( 0, 1), dims));

              float4 wL = waterIn.read(cL);
              float4 wR = waterIn.read(cR);
              float4 wD = waterIn.read(cD);
              float4 wU = waterIn.read(cU);

              float availCap = max(0.0f, cap - hc);
              float absorb = min(hs, availCap) * u.capillaryRate * u.dt;
              hs -= absorb;
              hc += absorb;

              float hcLap = (wL.y + wR.y + wD.y + wU.y - 4.0f * hc);
              float hsSpread = (wL.x + wR.x + wD.x + wU.x - 4.0f * hs) * 0.14f;
              hc = clamp(hc + hcLap * u.poreDiffusion * sizing * u.dt, 0.0f, cap * 1.15f);
              hs = max(0.0f, hs + hsSpread * u.dt);

              float neighborMaskAvg = 0.25f * (wL.z + wR.z + wD.z + wU.z);
              float edgeFactor = clamp((mask - neighborMaskAvg) * 3.5f, 0.0f, 1.0f);
              float evapRate = (u.evapBaseRate + u.evapEdgeBoost * edgeFactor) * u.dryBoost;

              hs = max(0.0f, hs - evapRate * u.dt);
              hc = max(0.0f, hc - evapRate * 0.42f * u.dt);

              float totalWater = hs + hc;
              float targetMask = smoothstep(0.015f, 0.09f, totalWater);
              mask = mix(mask, targetMask, clamp(u.dt * 4.0f, 0.0f, 1.0f));
              if (totalWater < 0.002f) {
                  hs = 0.0f;
                  hc = 0.0f;
                  mask = 0.0f;
              }

              waterOut.write(float4(hs, hc, mask, edgeFactor), gid);
          }

          // ============================================================================
          // Kernel 8: Molecular & Colloidal Pigment Dynamics (8 Real Chemical Pigments)
          // ============================================================================

          inline float4 advectPigment(
              texture2d<float, access::read> tex,
              float2 pos,
              int2 dims)
          {
              float2 p = clamp(pos, float2(0.0f), float2(dims - int2(1)));
              int2 p0 = int2(floor(p));
              int2 p1 = clampCoord(p0 + int2(1), dims);
              float2 f = fract(p);
              float4 c00 = tex.read(uint2(p0.x, p0.y));
              float4 c10 = tex.read(uint2(p1.x, p0.y));
              float4 c01 = tex.read(uint2(p0.x, p1.y));
              float4 c11 = tex.read(uint2(p1.x, p1.y));
              return mix(mix(c00, c10, f.x), mix(c01, c11, f.x), f.y);
          }

          kernel void pigmentMolecularKernel(
              texture2d<float, access::read> paperTex [[texture(0)]],
              texture2d<float, access::read> waterTex [[texture(1)]],
              texture2d<float, access::read> velTex [[texture(2)]],
