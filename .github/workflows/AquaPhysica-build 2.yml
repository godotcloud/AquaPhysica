              }

              private func computePressure(for touch: UITouch, speed: Float) -> Float {
                  if touch.maximumPossibleForce > 0 && touch.force > 0 {
                      return min(max(Float(touch.force / touch.maximumPossibleForce), 0.15), 1.0)
                  }
                  // Natural speed-to-pressure curve for finger painting on iPhone
                  let speedNorm = min(speed / 12.0, 1.0)
                  return 0.85 - 0.35 * speedNorm
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let engine = engine, !isNavigating else { return }
                  if (event?.allTouches?.count ?? touches.count) > 1 {
                      cancelActiveStroke()
                      return
                  }
                  guard let touch = touches.first else { return }
                  let pt = touch.location(in: self)
                  guard let uv = engine.viewPointToCanvasUV(pt, in: bounds.size) else { return }

                  activeDrawingTouch = touch
                  lastCanvasUV = uv
                  lastTouchTime = touch.timestamp
                  engine.beginStroke()

                  let pressure = computePressure(for: touch, speed: 0)
                  engine.enqueueStrokeSegment(StrokeSegment(startUV: uv, endUV: uv, velocity: .zero, pressure: pressure))
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let engine = engine, !isNavigating,
                        let active = activeDrawingTouch,
                        touches.contains(active) else { return }

                  let coalesced = event?.coalescedTouches(for: active) ?? [active]
                  for t in coalesced {
                      let pt = t.location(in: self)
                      guard let uv = engine.viewPointToCanvasUV(pt, in: bounds.size),
                            let prev = lastCanvasUV else { continue }

                      let dt = max(Float(t.timestamp - lastTouchTime), 1.0 / 240.0)
                      let diffPx = (uv - prev) * SIMD2<Float>(Float(engine.simWidth), Float(engine.simHeight))
                      let vel = diffPx / max(dt * 60.0, 0.25)
                      let speed = simd_length(vel)
                      let pressure = computePressure(for: t, speed: speed)

                      engine.enqueueStrokeSegment(StrokeSegment(startUV: prev, endUV: uv, velocity: vel, pressure: pressure))
                      lastCanvasUV = uv
                      lastTouchTime = t.timestamp
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  if let active = activeDrawingTouch, touches.contains(active) {
                      cancelActiveStroke()
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  cancelActiveStroke()
              }
          }
