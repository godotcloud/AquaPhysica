              int2 dims = int2(susp0In.get_width(), susp0In.get_height());
              int2 c = int2(gid);
              if (c.x >= dims.x || c.y >= dims.y) return;

              float4 paper = paperTex.read(gid);
              float paperHeight = paper.x;
              float valleyPocket = paper.z;

              float4 w = waterTex.read(gid);
              float hs = w.x;
              float hc = w.y;
              float edgeFactor = w.w;

              float4 s0 = susp0In.read(gid);
              float4 s1 = susp1In.read(gid);
              float4 d0 = dep0In.read(gid);
              float4 d1 = dep1In.read(gid);

              if (hs + hc < 0.004f) {
                  d0 = min(d0 + s0, float4(5.0f));
                  d1 = min(d1 + s1, float4(5.0f));
                  susp0Out.write(float4(0.0f), gid);
                  susp1Out.write(float4(0.0f), gid);
                  dep0Out.write(d0, gid);
                  dep1Out.write(d1, gid);
                  return;
              }

              float2 vel = velTex.read(gid).xy;
              float speed = length(vel);

              float2 backPos = float2(c) - vel * u.dt;
              float4 s0Adv = advectPigment(susp0In, backPos, dims);
              float4 s1Adv = advectPigment(susp1In, backPos, dims);

              uint2 cL = uint2(clampCoord(c + int2(-1, 0), dims));
              uint2 cR = uint2(clampCoord(c + int2( 1, 0), dims));
              uint2 cD = uint2(clampCoord(c + int2( 0,-1), dims));
              uint2 cU = uint2(clampCoord(c + int2( 0, 1), dims));

              float4 lap0 = (susp0In.read(cL) + susp0In.read(cR) + susp0In.read(cD) + susp0In.read(cU) - 4.0f * s0);
              float4 lap1 = (susp1In.read(cL) + susp1In.read(cR) + susp1In.read(cD) + susp1In.read(cU) - 4.0f * s1);
          EOF_F9_P2

      - name: Write Sources/Shaders/WatercolorShaders.metal (Part 3/4)
        run: |
          cat << 'EOF_F9_P3' >> Sources/Shaders/WatercolorShaders.metal

              float4 diff0 = float4(physData.phys[0].x, physData.phys[1].x, physData.phys[2].x, physData.phys[3].x);
              float4 diff1 = float4(physData.phys[4].x, physData.phys[5].x, physData.phys[6].x, physData.phys[7].x);

              float4 gran0 = float4(physData.phys[0].y, physData.phys[1].y, physData.phys[2].y, physData.phys[3].y);
              float4 gran1 = float4(physData.phys[4].y, physData.phys[5].y, physData.phys[6].y, physData.phys[7].y);

              float4 floc0 = float4(physData.phys[0].z, physData.phys[1].z, physData.phys[2].z, physData.phys[3].z);
              float4 floc1 = float4(physData.phys[4].z, physData.phys[5].z, physData.phys[6].z, physData.phys[7].z);

              float4 stain0 = float4(physData.phys[0].w, physData.phys[1].w, physData.phys[2].w, physData.phys[3].w);
              float4 stain1 = float4(physData.phys[4].w, physData.phys[5].w, physData.phys[6].w, physData.phys[7].w);

              float wetMobility = clamp((hs + hc * 0.4f) * 1.8f, 0.0f, 1.0f);
              s0 = max(float4(0.0f), s0Adv + lap0 * diff0 * u.temperature * wetMobility * u.dt * 0.22f);
              s1 = max(float4(0.0f), s1Adv + lap1 * diff1 * u.temperature * wetMobility * u.dt * 0.22f);

              float microNoise = valueNoise(float2(gid) * 0.37f + float2(paperHeight * 5.0f));
              float flocTrigger = clamp((0.65f - hs) * 1.4f, 0.0f, 1.0f) * (0.4f + 0.6f * valleyPocket);
              float4 clump0 = s0 * floc0 * flocTrigger * (microNoise - 0.42f) * u.dt * 0.65f;
              float4 clump1 = s1 * floc1 * flocTrigger * (microNoise - 0.42f) * u.dt * 0.65f;
              s0 = max(float4(0.0f), s0 + clump0);
              s1 = max(float4(0.0f), s1 + clump1);

              float shearResuspend = exp(-speed * 1.8f);
              float dryAccel = (1.0f + edgeFactor * 2.4f) * u.dryBoost;
              float valleyBias = 0.25f + 1.55f * (valleyPocket * valleyPocket);

              float4 settleRate0 = (0.04f + gran0 * valleyBias * shearResuspend + stain0 * 0.28f) * dryAccel * u.dt;
              float4 settleRate1 = (0.04f + gran1 * valleyBias * shearResuspend + stain1 * 0.28f) * dryAccel * u.dt;
              settleRate0 = clamp(settleRate0, float4(0.0f), float4(0.85f));
              settleRate1 = clamp(settleRate1, float4(0.0f), float4(0.85f));

              float4 newlyDep0 = s0 * settleRate0;
              float4 newlyDep1 = s1 * settleRate1;

              float rewetFactor = smoothstep(0.35f, 1.1f, hs) * (0.15f + 0.55f * speed) * u.dt;
              float4 desorb0 = d0 * (1.0f - stain0) * rewetFactor * 0.12f;
              float4 desorb1 = d1 * (1.0f - stain1) * rewetFactor * 0.12f;

              s0 = max(float4(0.0f), s0 - newlyDep0 + desorb0);
              s1 = max(float4(0.0f), s1 - newlyDep1 + desorb1);
              d0 = clamp(d0 + newlyDep0 - desorb0, float4(0.0f), float4(5.0f));
              d1 = clamp(d1 + newlyDep1 - desorb1, float4(0.0f), float4(5.0f));

              susp0Out.write(s0, gid);
              susp1Out.write(s1, gid);
              dep0Out.write(d0, gid);
              dep1Out.write(d1, gid);
          }

          // ============================================================================
          // Kernel 9: Pre-Wet Canvas (Uniform Damp Wash) & Clear / Instant Dry Utilities
          // ============================================================================

          kernel void preWetCanvasKernel(
              texture2d<float, access::read> waterIn [[texture(0)]],
              texture2d<float, access::write> waterOut [[texture(1)]],
              constant float& amount [[buffer(0)]],
              uint2 gid [[thread_position_in_grid]])
          {
              if (gid.x >= waterIn.get_width() || gid.y >= waterIn.get_height()) return;
              float4 w = waterIn.read(gid);
              w.x = min(w.x + amount, 1.6f);
              w.y = min(w.y + amount * 0.5f, 0.8f);
              w.z = 1.0f;
              waterOut.write(w, gid);
          }

          kernel void instantDryKernel(
              texture2d<float, access::write> waterOut [[texture(0)]],
              texture2d<float, access::write> velOut [[texture(1)]],
              texture2d<float, access::read> susp0In [[texture(2)]],
              texture2d<float, access::write> susp0Out [[texture(3)]],
              texture2d<float, access::read> susp1In [[texture(4)]],
              texture2d<float, access::write> susp1Out [[texture(5)]],
              texture2d<float, access::read> dep0In [[texture(6)]],
              texture2d<float, access::write> dep0Out [[texture(7)]],
              texture2d<float, access::read> dep1In [[texture(8)]],
              texture2d<float, access::write> dep1Out [[texture(9)]],
              uint2 gid [[thread_position_in_grid]])
          {
              if (gid.x >= waterOut.get_width() || gid.y >= waterOut.get_height()) return;
              float4 d0 = min(dep0In.read(gid) + susp0In.read(gid), float4(5.0f));
              float4 d1 = min(dep1In.read(gid) + susp1In.read(gid), float4(5.0f));
              waterOut.write(float4(0.0f), gid);
              velOut.write(float4(0.0f), gid);
              susp0Out.write(float4(0.0f), gid);
              susp1Out.write(float4(0.0f), gid);
              dep0Out.write(d0, gid);
              dep1Out.write(d1, gid);
          }

          kernel void clearCanvasKernel(
              texture2d<float, access::write> waterOut [[texture(0)]],
              texture2d<float, access::write> velOut [[texture(1)]],
              texture2d<float, access::write> susp0Out [[texture(2)]],
              texture2d<float, access::write> susp1Out [[texture(3)]],
              texture2d<float, access::write> dep0Out [[texture(4)]],
              texture2d<float, access::write> dep1Out [[texture(5)]],
              uint2 gid [[thread_position_in_grid]])
          {
              if (gid.x >= waterOut.get_width() || gid.y >= waterOut.get_height()) return;
              waterOut.write(float4(0.0f), gid);
              velOut.write(float4(0.0f), gid);
              susp0Out.write(float4(0.0f), gid);
              susp1Out.write(float4(0.0f), gid);
              dep0Out.write(float4(0.0f), gid);
              dep1Out.write(float4(0.0f), gid);
          }

          // ============================================================================
          // Optical Rendering Pass: Kubelka-Munk Two-Flux Radiative Transfer
          // ============================================================================

          struct VertexOut {
              float4 position [[position]];
              float2 uv;
          };

          vertex VertexOut watercolorVertex(uint vid [[vertex_id]]) {
              const float2 pos[4] = {
                  float2(-1.0f, -1.0f),
                  float2( 1.0f, -1.0f),
                  float2(-1.0f,  1.0f),
                  float2( 1.0f,  1.0f)
              };
              const float2 uvs[4] = {
                  float2(0.0f, 1.0f),
                  float2(1.0f, 1.0f),
                  float2(0.0f, 0.0f),
                  float2(1.0f, 0.0f)
              };
              VertexOut out;
              out.position = float4(pos[vid], 0.0f, 1.0f);
              out.uv = uvs[vid];
              return out;
          }

          inline float3 kubelkaMunkLayer(float3 K, float3 S, float thickness, float3 R0) {
              if (thickness <= 1e-5f) return R0;

              float3 sSafe = max(S, float3(1e-4f));
              float3 kSafe = max(K, float3(1e-4f));
              float3 a = 1.0f + kSafe / sSafe;
              float3 b = sqrt(max(a * a - 1.0f, float3(1e-6f)));

              float3 bSd = min(b * sSafe * thickness, float3(12.0f));
              float3 sh = sinh(bSd);
              float3 ch = cosh(bSd);

              float3 num = sh * (1.0f - R0 * a) + R0 * b * ch;
              float3 den = max(sh * (a - R0) + b * ch, float3(1e-5f));
              return clamp(num / den, float3(0.0f), float3(1.0f));
          }

          fragment float4 watercolorFragment(
              VertexOut in [[stage_in]],
              texture2d<float, access::sample> paperTex [[texture(0)]],
              texture2d<float, access::sample> waterTex [[texture(1)]],
              texture2d<float, access::sample> dep0Tex [[texture(2)]],
              texture2d<float, access::sample> dep1Tex [[texture(3)]],
              texture2d<float, access::sample> susp0Tex [[texture(4)]],
              texture2d<float, access::sample> susp1Tex [[texture(5)]],
              constant RenderUniforms& u [[buffer(0)]],
              constant PigmentOpticalData& optData [[buffer(1)]])
          {
              constexpr sampler linSampler(coord::normalized, address::clamp_to_edge, filter::linear);

              float2 cuv = in.uv;
              if (u.isExportPass < 0.5f) {
                  float2 viewCentered = (in.uv - 0.5f) * u.viewportSize;
                  float cosR = cos(-u.rotation);
                  float sinR = sin(-u.rotation);
                  float2 rotated = float2(
                      viewCentered.x * cosR - viewCentered.y * sinR,
                      viewCentered.x * sinR + viewCentered.y * cosR
                  );
                  float fitScale = min(u.viewportSize.x / u.canvasSize.x, u.viewportSize.y / u.canvasSize.y) * 0.94f;
                  float2 canvasPx = rotated / max(fitScale * u.zoom, 1e-4f) - u.pan * u.canvasSize;
                  cuv = canvasPx / u.canvasSize + 0.5f;

                  if (cuv.x < 0.0f || cuv.x > 1.0f || cuv.y < 0.0f || cuv.y > 1.0f) {
                      float2 edgeDist = max(float2(0.0f) - cuv, cuv - float2(1.0f));
                      float shadow = exp(-length(edgeDist) * 38.0f);
                      float3 desk = float3(0.11f, 0.115f, 0.125f) * (1.0f - 0.45f * shadow);
                      return float4(desk, 1.0f);
                  }
              }

              float4 paper = paperTex.sample(linSampler, cuv);
              float4 water = waterTex.sample(linSampler, cuv);
              float4 d0 = dep0Tex.sample(linSampler, cuv);
              float4 d1 = dep1Tex.sample(linSampler, cuv);
              float4 s0 = susp0Tex.sample(linSampler, cuv);
              float4 s1 = susp1Tex.sample(linSampler, cuv);

              float2 texel = 1.0f / u.canvasSize;
              float hL = paperTex.sample(linSampler, cuv - float2(texel.x, 0.0f)).x;
              float hR = paperTex.sample(linSampler, cuv + float2(texel.x, 0.0f)).x;
              float hD = paperTex.sample(linSampler, cuv - float2(0.0f, texel.y)).x;
              float hU = paperTex.sample(linSampler, cuv + float2(0.0f, texel.y)).x;

              float wL = waterTex.sample(linSampler, cuv - float2(texel.x, 0.0f)).x;
              float wR = waterTex.sample(linSampler, cuv + float2(texel.x, 0.0f)).x;
              float wD = waterTex.sample(linSampler, cuv - float2(0.0f, texel.y)).x;
              float wU = waterTex.sample(linSampler, cuv + float2(0.0f, texel.y)).x;

              float hs = water.x;
              float hc = water.y;
              float bumpScale = u.paperTintAndBump.w;

              float3 paperNormal = normalize(float3(
                  (hL - hR) * bumpScale,
                  (hD - hU) * bumpScale,
                  1.0f
              ));

              float3 lightDir = normalize(float3(
                  cos(u.lightAzimuth) * cos(u.lightElevation),
                  sin(u.lightAzimuth) * cos(u.lightElevation),
                  sin(u.lightElevation)
              ));
              float3 viewDir = float3(0.0f, 0.0f, 1.0f);

              float ndl = clamp(dot(paperNormal, lightDir), 0.0f, 1.0f);
              float paperShade = 0.90f + 0.12f * ndl - 0.04f * (1.0f - paper.x);
              float dampDarken = 1.0f - clamp((hs * 0.35f + hc * 0.45f) * 0.06f, 0.0f, 0.06f);
              float3 R0 = clamp(u.paperTintAndBump.xyz * paperShade * dampDarken, float3(0.0f), float3(1.0f));

              // Step A: Kubelka-Munk Deposited Dry Glaze
              float depArr[8] = { d0.x, d0.y, d0.z, d0.w, d1.x, d1.y, d1.z, d1.w };
              float3 K_dep = float3(0.0f);
              float3 S_dep = float3(0.0f);
              float totalDep = 0.0f;

              for (int i = 0; i < 8; ++i) {
                  float c = depArr[i];
                  if (c > 1e-4f) {
                      float density = optData.K[i].w;
                      K_dep += optData.K[i].xyz * (c * density);
                      S_dep += optData.S[i].xyz * (c * density);
                      totalDep += c * density;
                  }
              }

              float3 colorAfterDep = R0;
              if (totalDep > 1e-4f) {
                  colorAfterDep = kubelkaMunkLayer(K_dep / totalDep, S_dep / totalDep, totalDep, R0);
              }

              // Step B: Kubelka-Munk Wet Suspended Pigment Glaze
              float suspArr[8] = { s0.x, s0.y, s0.z, s0.w, s1.x, s1.y, s1.z, s1.w };
              float3 K_susp = float3(0.0f);
              float3 S_susp = float3(0.0f);
              float totalSusp = 0.0f;

              for (int i = 0; i < 8; ++i) {
                  float c = suspArr[i];
                  if (c > 1e-4f) {
                      float density = optData.K[i].w * 0.85f;
                      K_susp += optData.K[i].xyz * (c * density);
                      S_susp += optData.S[i].xyz * (c * density);
                      totalSusp += c * density;
                  }
              }

              float3 finalColor = colorAfterDep;
              if (totalSusp > 1e-4f) {
                  finalColor = kubelkaMunkLayer(K_susp / totalSusp, S_susp / totalSusp, totalSusp, colorAfterDep);
              }

              // Step C: Wet Water Meniscus Normal & Schlick Fresnel Specular Sheen
              if (hs > 0.015f && u.isExportPass < 0.5f) {
                  float wetSmooth = clamp(hs * 2.2f, 0.0f, 1.0f);
                  float3 waterNormal = normalize(float3(
                      (wL - wR) * 3.8f + (hL - hR) * bumpScale * (1.0f - 0.7f * wetSmooth),
                      (wD - wU) * 3.8f + (hD - hU) * bumpScale * (1.0f - 0.7f * wetSmooth),
                      1.0f
                  ));
                  float3 halfVec = normalize(lightDir + viewDir);
                  float ndh = max(dot(waterNormal, halfVec), 0.0f);
                  float ndv = max(dot(waterNormal, viewDir), 0.0f);

          EOF_F9_P3

      - name: Write Sources/Shaders/WatercolorShaders.metal (Part 4/4)
        run: |
          cat << 'EOF_F9_P4' >> Sources/Shaders/WatercolorShaders.metal
                  float fresnel = 0.0204f + (1.0f - 0.0204f) * pow(1.0f - ndv, 5.0f);
                  float spec = pow(ndh, 72.0f) * (0.28f + 0.72f * fresnel) * u.wetGlossiness * wetSmooth;
                  finalColor += float3(1.0f, 0.99f, 0.97f) * spec;
              }

              finalColor = clamp(finalColor, float3(0.0f), float3(1.0f));
              float3 encoded = pow(max(finalColor, float3(0.0f)), float3(1.0f / 2.2f));
              return float4(encoded, 1.0f);
          }
          EOF_F9_P4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la AquaPhysica.xcodeproj

      - name: Build Unsigned iOS App (Release)
        run: |
          xcodebuild \
            -project AquaPhysica.xcodeproj \
            -scheme AquaPhysica \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "AquaPhysica.app" -maxdepth 2 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: AquaPhysica.app not found!"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry AquaPhysica-v1.0.0.ipa Payload
          ls -lh AquaPhysica-v1.0.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaPhysica-IPA
          path: build/AquaPhysica-v1.0.0.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          TAG="v1.0.0-build-${RUN_NUM}"
          gh release create "$TAG" build/AquaPhysica-v1.0.0.ipa \
            --repo "$GH_REPO" \
            --target "$GH_SHA" \
            --title "AquaPhysica v1.0.0 (Build ${RUN_NUM})" \
            --notes "Physically-based iOS native watercolor simulator (Fluid Dynamics + Molecular/Colloidal Dynamics + Kubelka-Munk Optics). Built on macOS 15."
