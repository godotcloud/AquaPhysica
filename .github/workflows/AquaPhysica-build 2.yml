          kernel void velocityProjectKernel(
              texture2d<float, access::read> velIn [[texture(0)]],
              texture2d<float, access::read> pressTex [[texture(1)]],
              texture2d<float, access::read> waterTex [[texture(2)]],
              texture2d<float, access::write> velOut [[texture(3)]],
